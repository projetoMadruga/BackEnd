<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinir Senha - Ouvidoria SENAI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .card {
            border: none;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
        }
        .card-header {
            background-color: #0d6efd;
            color: white;
            text-align: center;
            font-weight: bold;
            border-radius: 10px 10px 0 0 !important;
        }
        .btn-primary {
            background-color: #0d6efd;
            border: none;
            padding: 10px 20px;
            font-weight: 500;
        }
        .btn-primary:hover {
            background-color: #0b5ed7;
        }
        .form-control:focus {
            border-color: #86b7fe;
            box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.25);
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h4>Redefinir Senha</h4>
                    </div>
                    <div class="card-body p-4">
                        <div th:if="${mensagem != null}" class="alert alert-success" role="alert" th:text="${mensagem}"></div>
                        <div th:if="${erro != null}" class="alert alert-danger" role="alert" th:text="${erro}"></div>
                        
                        <form th:action="@{/redefinir-senha}" method="post" th:object="${redefinirSenhaDTO}">
                            <input type="hidden" th:field="*{token}" />
                            
                            <div class="mb-3">
                                <label for="novaSenha" class="form-label">Nova Senha</label>
                                <input type="password" class="form-control" id="novaSenha" th:field="*{novaSenha}" 
                                       required minlength="8" placeholder="Digite sua nova senha">
                                <div class="form-text">A senha deve ter no mínimo 8 caracteres.</div>
                            </div>
                            
                            <div class="mb-3">
                                <label for="confirmarSenha" class="form-label">Confirmar Nova Senha</label>
                                <input type="password" class="form-control" id="confirmarSenha" 
                                       required minlength="8" placeholder="Confirme sua nova senha">
                            </div>
                            
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary">Redefinir Senha</button>
                            </div>
                        </form>
                    </div>
                </div>
                
                <div class="text-center mt-3">
                    <a th:href="@{/login}" class="text-decoration-none">Voltar para o login</a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Validação de confirmação de senha
        document.querySelector('form').addEventListener('submit', function(event) {
            const novaSenha = document.getElementById('novaSenha').value;
            const confirmarSenha = document.getElementById('confirmarSenha').value;
            
            if (novaSenha !== confirmarSenha) {
                event.preventDefault();
                alert('As senhas não coincidem. Por favor, verifique e tente novamente.');
                return false;
            }
            
            if (novaSenha.length < 8) {
                event.preventDefault();
                alert('A senha deve ter no mínimo 8 caracteres.');
                return false;
            }
            
            return true;
        });
    </script>
</body>
</html>
